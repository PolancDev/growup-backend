server:
  port: 8083

spring:
  application:
    name: growup-enrollment
  
  # Micrometer Tracing Configuration
  autoconfigure:
    exclude:
      - org.springframework.cloud.sleuth.annotation.SleuthAnnotationAutoConfiguration
  
  # Zipkin Configuration
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://zipkin:9411}
    discovery-client-enabled: true
    sender:
      type: web
   
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/growup_enrollment?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Auth and Course Service URLs
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth:8081}
course:
  service:
    url: ${COURSE_SERVICE_URL:http://course:8082}

  # Eureka Client Configuration
  eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://discovery:8761/eureka/}
    registry-fetch-interval-seconds: 10

  # OAuth2 Resource Server (Keycloak) Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/growup}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8180/realms/growup/protocol/openid-connect/certs}
 
  # Keycloak Configuration
  keycloak:
    issuer: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/growup}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator endpoints for health monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerdetails,tracing
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      authService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - com.growup.common.exception.ServiceUnavailableException
      courseService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - com.growup.common.exception.ServiceUnavailableException
  retry:
    instances:
      authServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
      courseServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
  timelimiter:
    instances:
      authService:
        timeoutDuration: 3s
        cancelRunningFuture: true
      courseService:
        timeoutDuration: 3s
        cancelRunningFuture: true
  ratelimiter:
    instances:
      default:
        limitForPeriod: 50
        limitRefreshPeriod: 10s
        timeoutDuration: 3s

logging:
  level:
    com.growup.enrollment: DEBUG
    com.netflix.discovery: INFO
