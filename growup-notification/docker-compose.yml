version: '3.8'

services:
  # PostgreSQL Database for Notification Service
  postgres-notification:
    image: postgres:15-alpine
    container_name: growup-notification-db
    environment:
      POSTGRES_DB: growup_notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Notification Service Application
  notification:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: growup-notification
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/growup_notification
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AUTH_SERVICE_URL: http://host.docker.internal:8081
      JWT_SECRET: GrowUpSecretKeyForJWTTokenValidationMinimum256BitsRequired!
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC"
    depends_on:
      postgres-notification:
        condition: service_healthy
    restart: on-failure
    networks:
      - growup-network

volumes:
  postgres_notification_data:

networks:
  growup-network:
    driver: bridge
