server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:GrowUpJWTSecret2026!@#$%^&*()_+SecureKey32Min} # ⚠️ CAMBIAR EN PRODUCCIÓN: usar variable de entorno JWT_SECRET (mínimo 32 chars para HS256)
  expiration: 86400000 # 24 horas en milisegundos
  
spring:
  application:
    name: growup-auth
  
  autoconfigure:
    exclude:
      - org.springframework.cloud.sleuth.annotation.SleuthAnnotationAutoConfiguration
  
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://zipkin:9411}
    discovery-client-enabled: true
    sender:
      type: web
    
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/growup_auth}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration/auth
    baseline-on-migrate: true

  eureka:
    instance:
      prefer-ip-address: true
      instance-id: ${spring.application.name}:${server.port}
    client:
      service-url:
        defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
      registry-fetch-interval-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerdetails,tracing
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.growup.auth: DEBUG
    com.netflix.discovery: INFO
