server:
  port: 8081

spring:
  application:
    name: growup-auth
  
  datasource:
    url: jdbc:postgresql://localhost:5432/growup_auth_test
    username: postgres
    password: Admin@123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
   
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:GrowUpSecretKeyForJWTTokenValidationMinimum256BitsRequired!}
  expiration: 86400000

logging:
  level:
    com.growup.auth: DEBUG
