server:
  port: 8761

spring:
  application:
    name: growup-discovery

# Eureka Server Configuration
eureka:
  instance:
    hostname: localhost
  client:
    # Disable self-registration (this is the server, not a client)
    register-with-eureka: false
    # Disable fetching registry from other Eureka servers
    fetch-registry: false
    service-url:
      default-zone: http://${eureka.instance.hostname}:${server.port}/eureka/
  dashboard:
    enabled: true
  # Server settings - for development
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 60000
    # Renewal percentage threshold
    renewal-percent-threshold: 0.85

# Actuator endpoints for health monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  # Disable tracing in Eureka Server (not necessary)
  tracing:
    enabled: false

# Logging configuration
logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
