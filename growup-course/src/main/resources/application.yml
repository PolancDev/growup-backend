server:
  port: 8082

spring:
  application:
    name: growup-course

  # Micrometer Tracing Configuration
  autoconfigure:
    exclude:
      - org.springframework.cloud.sleuth.annotation.SleuthAnnotationAutoConfiguration

  # Zipkin Configuration
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
    discovery-client-enabled: true
    sender:
      type: web

  datasource:
    url: jdbc:postgresql://localhost:5432/growup_course?currentSchema=public
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Admin@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration/course
    baseline-on-migrate: true

# JWT Secret compartido con auth-service para validación HMAC (HS256)
jwt:
  secret: ${JWT_SECRET:GrowUpJWTSecret2026!@#$%^&*()_+SecureKey32Min}

# Auth Service URL for instructor validation
auth:
  service:
    url: http://localhost:8081

# Eureka Client Configuration
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 10

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator endpoints for health monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerdetails,tracing
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      authService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - com.growup.common.exception.ServiceUnavailableException
  retry:
    instances:
      authServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException.ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientResponseException.InternalServerError
  timelimiter:
    instances:
      authService:
        timeoutDuration: 3s
        cancelRunningFuture: true
  ratelimiter:
    instances:
      default:
        limitForPeriod: 50
        limitRefreshPeriod: 10s
        timeoutDuration: 3s

logging:
  level:
    com.growup.course: DEBUG
    com.netflix.discovery: INFO
