server:
  port: 8080

spring:
  application:
    name: growup-gateway
  main:
    web-application-type: reactive
  # Deshabilitar Zipkin y Sleuth completamente
  autoconfigure:
    exclude:
      - org.springframework.cloud.sleuth.springnative.condition.ConditionalOnSleuthNative
      - org.springframework.cloud.sleuth.autoconfigure.ZipkinAutoConfiguration
      - org.springframework.cloud.sleuth.autoconfigure.SleuthLogAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
  zipkin:
    enabled: false
    base-url: http://localhost:9411
  sleuth:
    enabled: false
  
  # JWT Resource Server Configuration (GrowUp Auth)
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:GrowUpJWTSecret2026!@#$%^&*()_+SecureKey32Min}
  
  cloud:
    gateway:
      # Métricas habilitadas
      metrics:
        enabled: true
        use-global-predicate: true
      
      # Rutas dinámicas usando Discovery Client (deshabilitado para usar rutas estáticas)
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      
      # Configuración CORS global
      # Nota: El bean CorsWebFilter se eliminó de GatewayConfig.java para evitar duplicación
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
              - X-User-Id
              - X-User-Email
              - X-User-Roles
              - X-User-Name
            allowCredentials: true
            maxAge: 3600
      
      # default-filters: DESHABILITADO para diagnosticar error 500
      #  - name: Retry
      #    args:
      #      retries: 3
      #      series: SERVER_ERROR
      #      methods: GET,POST
      #      exceptions: java.io.IOException,java.net.ConnectException
      
      # Rutas a servicios (usando URLs directas temporalmente)
      routes:
        # Auth Service (login, register)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        
        # Admin Service (user management)
        - id: admin-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/admin/**
        
        # Course Service
        - id: course-service
          uri: lb://growup-course
          predicates:
            - Path=/api/v1/courses/**
        
        # Teacher endpoints (también van al course service)
        - id: teacher-service
          uri: lb://growup-course
          predicates:
            - Path=/api/v1/teacher/**
        
        # Enrollment Service
        - id: enrollment-service
          uri: lb://growup-enrollment
          predicates:
            - Path=/api/v1/student/**
        
        # Notification Service
        - id: notification-service
          uri: lb://growup-notification
          predicates:
            - Path=/api/v1/notifications/**
        
        # Health endpoints - público
        - id: actuator-health
          uri: http://localhost:8081
          predicates:
            - Path=/actuator/health
          filters:
            - SetPath=/actuator/health

# Configuración de HTTP Client para el Gateway
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,circuitbreakers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  gateway:
    metrics:
      enabled: true

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"
